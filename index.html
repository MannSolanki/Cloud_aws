

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cool Website</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            color: #00ffff;
            text-shadow: 0 0 20px cyan;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #00ffff;
            color: #111;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px cyan;
        }
    </style>
</head>

<body>
    <h1>🚀 Welcome to My World</h1>
    <p id="message">Click the button for a surprise!</p>

    <button onclick="surprise()">Click Me ✨</button>

    <script>
        function surprise() {
            document.getElementById("message").innerHTML =
                "🔥 You are awesome! Keep coding! 💻";

            document.body.style.background =
                `linear-gradient(135deg,
                hsl(${Math.random() * 360}, 70%, 25%),
                #141e30)`;
        }
    </script>
</body>
</html>
